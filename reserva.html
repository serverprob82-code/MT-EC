<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Cita - Miel Terrazas</title>
    <style>
        :root {
            --fondo-crema: #FFF8F5;
            --rosa-suave: #FFD1DC;
            --rosa-fuerte: #E08E9B;
            --marron-texto: #5C4033;
            --blanco: #FFFFFF;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--fondo-crema);
            color: var(--marron-texto);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .contenedor-reserva {
            background-color: var(--blanco);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--rosa-fuerte);
        }

        .logo {
            max-width: 150px;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--rosa-fuerte);
            margin-bottom: 20px;
        }

        .grupo-input {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--rosa-suave);
            border-radius: 8px;
            box-sizing: border-box;
            color: var(--marron-texto);
            background-color: var(--fondo-crema);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--rosa-fuerte);
        }

        .btn-reservar {
            background-color: var(--rosa-fuerte);
            color: var(--blanco);
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-reservar:hover {
            background-color: #C77582;
        }
        
        .btn-reservar:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .volver {
            display: block;
            margin-top: 15px;
            color: var(--rosa-fuerte);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="contenedor-reserva">
        <img src="img/logo.jpg" alt="Miel Terrazas Logo" class="logo">
        
        <h2>Agenda tu Cita</h2>
        
        <form id="formulario-reserva">
            <div class="grupo-input">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej. Ana Silva" required>
            </div>

            <div class="grupo-input">
                <label for="celular">Número de Celular / WhatsApp:</label>
                <input type="tel" id="celular" placeholder="Ej. 71234567" required>
            </div>
            
            <div class="grupo-input">
                <label for="tratamiento">Tratamiento:</label>
                <select id="tratamiento" required>
                    <option value="">Cargando tratamientos...</option>
                </select>
            </div>
            
            <div class="grupo-input">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="grupo-input">
                <label for="hora">Hora:</label>
                <select id="hora" required>
                    <option value="">Selecciona una hora...</option>
                    <option value="09:00">09:00 AM</option>
                    <option value="10:00">10:00 AM</option>
                    <option value="11:00">11:00 AM</option>
                    <option value="15:00">03:00 PM</option>
                    <option value="16:00">04:00 PM</option>
                    <option value="17:00">05:00 PM</option>
                </select>
            </div>

            <button type="button" id="btn-reservar" class="btn-reservar">Confirmar Reserva</button>
            <a href="index.html" class="volver">← Volver al inicio</a>
        </form>
    </div>

    <!-- CONEXIÓN DIRECTA A FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuczvjYVzRFkS699_DImPW-brTnMxZtCs",
            authDomain: "miel-estetica-web.firebaseapp.com",
            projectId: "miel-estetica-web",
            storageBucket: "miel-estetica-web.firebasestorage.app",
            messagingSenderId: "1099087151356",
            appId: "1:1099087151356:web:82f79034798fe90b38d779"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const DOC_REF = doc(db, "miel_terrazas", "datos_panel");

        const selectTratamiento = document.getElementById('tratamiento');
        const btnReservar = document.getElementById('btn-reservar');

        // 1. Cargar Tratamientos Dinámicamente desde el Panel
        async function cargarTratamientos() {
            try {
                const snap = await getDoc(DOC_REF);
                if (snap.exists()) {
                    const data = snap.data();
                    const tratamientos = data.tratamientos || [];

                    selectTratamiento.innerHTML = '<option value="">Selecciona un tratamiento...</option>';
                    
                    // Llenar opciones solo con los activos
                    tratamientos.filter(t => t.activo !== false).forEach(t => {
                        let option = document.createElement('option');
                        const nombreTratamiento = t.es?.titulo || t.nombre || "Tratamiento";
                        option.value = nombreTratamiento; 
                        option.textContent = nombreTratamiento;
                        selectTratamiento.appendChild(option);
                    });

                    // Seleccionar si el usuario viene de hacer clic en la página principal
                    const parametrosURL = new URLSearchParams(window.location.search);
                    const tratamientoDesdeInicio = parametrosURL.get('tratamiento');
                    
                    if (tratamientoDesdeInicio) {
                        let existe = Array.from(selectTratamiento.options).some(opt => opt.value === tratamientoDesdeInicio);
                        if (!existe) {
                            let option = document.createElement('option');
                            option.value = tratamientoDesdeInicio;
                            option.textContent = tratamientoDesdeInicio;
                            selectTratamiento.appendChild(option);
                        }
                        selectTratamiento.value = tratamientoDesdeInicio;
                    }
                }
            } catch (error) {
                console.error("Error cargando base de datos: ", error);
                selectTratamiento.innerHTML = '<option value="">Error al cargar tratamientos</option>';
            }
        }

        cargarTratamientos();

        // 2. Guardar la reserva directo en Firebase
        btnReservar.addEventListener('click', async () => {
            const nombre = document.getElementById('nombre').value;
            const celular = document.getElementById('celular').value;
            const tratamiento = document.getElementById('tratamiento').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            if(!nombre || !celular || !tratamiento || !fecha || !hora) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            // Cambiamos el estado del botón mientras guarda
            btnReservar.disabled = true;
            btnReservar.textContent = "Procesando...";

            try {
                // Leemos las citas actuales en la nube
                const snap = await getDoc(DOC_REF);
                let citasGuardadas = [];
                if (snap.exists()) {
                    citasGuardadas = snap.data().citas || [];
                }

                // Filtrar cuántas citas ya hay confirmadas o pendientes en ese horario
                let citasEnEseHorario = citasGuardadas.filter(r => r.fecha === fecha && r.hora === hora);
                
                if (citasEnEseHorario.length >= 2) {
                    alert("Lo sentimos, el cupo para este horario ya está lleno. Por favor, elige otra hora u otra fecha.");
                    btnReservar.disabled = false;
                    btnReservar.textContent = "Confirmar Reserva";
                    return; 
                }

                const nuevaReserva = {
                    id: "cita_" + Date.now(),
                    nombre: nombre,
                    celular: celular,
                    tratamiento: tratamiento,
                    fecha: fecha,
                    hora: hora,
                    estado: 'Pendiente' 
                };

                // Enviamos la cita a Firestore
                await updateDoc(DOC_REF, {
                    citas: arrayUnion(nuevaReserva)
                });

                alert("¡Tu reserva ha sido enviada con éxito! Te contactaremos pronto para confirmar.");
                window.location.href = "index.html"; 

            } catch (error) {
                console.error("Error al guardar reserva:", error);
                alert("Hubo un error de conexión al procesar tu reserva. Intenta de nuevo.");
                btnReservar.disabled = false;
                btnReservar.textContent = "Confirmar Reserva";
            }
        });
    </script>
</body>
</html>
